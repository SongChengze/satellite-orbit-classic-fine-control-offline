<style data-module="archive-enhancement-v2">.archive-open-button {
  min-height: 34px;
  padding: 0 13px;
  border: 1px solid rgba(103, 221, 255, .42);
  border-radius: 8px;
  color: #dff8ff;
  background: linear-gradient(180deg, rgba(22, 78, 104, .88), rgba(8, 34, 50, .92));
  font: 700 12px/1 system-ui, sans-serif;
  letter-spacing: .05em;
  cursor: pointer;
}
.archive-open-button:hover { border-color: #67ddff; background: rgba(20, 80, 108, .96); }
.archive-backdrop {
  position: fixed;
  inset: 0;
  z-index: 10000;
  display: grid;
  place-items: center;
  padding: 24px;
  background: rgba(0, 8, 16, .78);
  backdrop-filter: blur(7px);
}
.archive-backdrop[hidden] { display: none; }
.archive-dialog {
  width: min(720px, 94vw);
  max-height: 90vh;
  overflow: auto;
  border: 1px solid rgba(103, 221, 255, .38);
  border-radius: 16px;
  color: #e7f7fb;
  background: linear-gradient(145deg, rgba(8, 30, 45, .98), rgba(3, 15, 26, .99));
  box-shadow: 0 28px 80px rgba(0, 0, 0, .58), inset 0 1px rgba(255,255,255,.05);
}
.archive-head { display:flex; align-items:flex-start; justify-content:space-between; gap:20px; padding:22px 24px 16px; border-bottom:1px solid rgba(151,202,222,.14); }
.archive-head small { display:block; color:#75dff9; font:700 10px/1.2 system-ui; letter-spacing:.15em; }
.archive-head h2 { margin:6px 0 4px; font:700 22px/1.25 system-ui; }
.archive-head p { margin:0; color:#91afba; font:12px/1.55 system-ui; }
.archive-close { width:34px; height:34px; border:1px solid rgba(180,218,230,.2); border-radius:8px; color:#b9d5de; background:rgba(255,255,255,.04); font-size:20px; cursor:pointer; }
.archive-body { padding:20px 24px 24px; }
.archive-fields { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.archive-fields label { display:grid; gap:6px; color:#a9c3cc; font:600 11px/1.2 system-ui; }
.archive-fields label:last-child { grid-column:1 / -1; }
.archive-fields input, .archive-fields textarea { width:100%; box-sizing:border-box; border:1px solid rgba(145,202,222,.22); border-radius:8px; padding:9px 10px; color:#eefbff; background:rgba(0,8,14,.6); font:13px/1.4 system-ui; outline:none; }
.archive-fields input:focus, .archive-fields textarea:focus { border-color:#65d9f6; box-shadow:0 0 0 2px rgba(101,217,246,.1); }
.archive-fields textarea { min-height:64px; resize:vertical; }
.archive-summary { margin:16px 0; padding:12px 14px; border:1px solid rgba(105,219,184,.2); border-radius:9px; color:#a9c6ce; background:rgba(31,108,91,.1); font:12px/1.55 system-ui; }
.archive-summary strong { color:#72e4be; }
.archive-actions { display:grid; grid-template-columns:repeat(2,1fr); gap:10px; }
.archive-action { min-height:42px; border:1px solid rgba(135,197,218,.25); border-radius:9px; color:#dceef3; background:rgba(28,67,83,.42); font:700 13px/1 system-ui; cursor:pointer; }
.archive-action:hover { border-color:rgba(103,221,255,.65); background:rgba(32,91,112,.54); }
.archive-action.primary { color:#052017; border-color:#67e2ba; background:#67e2ba; }
.archive-action.primary:hover { background:#82ecc9; }
.archive-action:disabled { opacity:.38; cursor:not-allowed; }
.archive-note { margin:14px 0 0; color:#78949e; font:11px/1.55 system-ui; }
.archive-status { margin-top:14px; min-height:38px; padding:10px 12px; border-radius:8px; color:#b9d3dc; background:rgba(255,255,255,.035); font:12px/1.5 system-ui; }
.archive-status.ok { color:#7be9c3; background:rgba(47,166,129,.12); }
.archive-status.error { color:#ffb08f; background:rgba(205,89,55,.12); }
@media (max-width: 720px) {
  .archive-fields, .archive-actions { grid-template-columns:1fr; }
  .archive-fields label:last-child { grid-column:auto; }
}


body.archive-playback-mode .freeze-button,
body.archive-playback-mode .burn-button,

@media (max-width:720px) {

    function setStatus(message, type = "") {

    }

    function updateSummary(data, prefix) {
      const hours = data.state.simTime / 3600;
      const adjustmentCount = data.events.reduce((sum, item) => sum + (Array.isArray(item.adjustments) ? item.adjustments.length : 1), 0);
      summary.innerHTML = "";
      const strong = document.createElement("strong");
      strong.textContent = prefix;
      summary.appendChild(strong);
      summary.appendChild(document.createElement("br"));
      summary.appendChild(document.createTextNode(
        "仿真时刻 " + (hours < 24 ? hours.toFixed(2) + " h" : (hours / 24).toFixed(2) + " d") +
        "　·　轨迹点 " + data.trajectory.length.toLocaleString() +
        "　·　变轨 " + data.events.length + " 次" +

      ));
    }

    function sanitizeFilename(value) {

    function formatTime(value) {
      const total = Math.max(0, Math.floor(value || 0));
      const days = Math.floor(total / 86400);
      const h = String(Math.floor(total % 86400 / 3600)).padStart(2, "0");
      const m = String(Math.floor(total % 3600 / 60)).padStart(2, "0");
      const s = String(total % 60).padStart(2, "0");
      return (days ? days + "d " : "") + h + ":" + m + ":" + s;
    }

    function describeEvent(item, index) {
      const direction = item.deltaVMps >= 0 ? "顺轨加速" : "逆轨减速";
      const type = item.mode === "circularize" ? "自动圆化" : item.mode === "mixed" ? "精调＋自动圆化" : direction;
      const adjustmentCount = Array.isArray(item.adjustments) ? item.adjustments.length : 1;
      return "第 " + (index + 1) + " 次变轨｜" + type + "｜净 Δv " + (item.deltaVMps >= 0 ? "+" : "−") + Math.abs(item.deltaVMps).toFixed(1) + " m/s｜精调 " + adjustmentCount + " 次｜t = " + formatTime(item.simTime);

  function normalizeManeuvers(events) {
    const grouped = [];
    for (const raw of events || []) {
      const adjustments = Array.isArray(raw.adjustments) && raw.adjustments.length
        ? raw.adjustments.map(item => ({ ...item }))
        : [{ kind:raw.type === "circularize" ? "circularize" : "manual", deltaVMps:raw.deltaVMps, beforeVelocity:{...raw.beforeVelocity}, afterVelocity:{...raw.afterVelocity} }];
      const last = grouped[grouped.length - 1];
      const sameSession = raw.sessionId != null && last && last.sessionId === raw.sessionId;
      const sameLegacyPoint = raw.sessionId == null && last && last.sessionId == null &&
        Math.abs(last.simTime - raw.simTime) < 1e-6 &&
        Math.hypot(last.position.x - raw.position.x, last.position.y - raw.position.y) < 1e-3;
      if (sameSession || sameLegacyPoint) {
        last.deltaV += raw.deltaV;
        last.deltaVMps += raw.deltaVMps;
        last.absoluteDeltaVMps += Number.isFinite(raw.absoluteDeltaVMps) ? raw.absoluteDeltaVMps : Math.abs(raw.deltaVMps);
        last.afterVelocity = { ...raw.afterVelocity };
        last.adjustments.push(...adjustments);
        const rawMode = raw.mode || (raw.type === "circularize" ? "circularize" : "manual");
        if (last.mode !== rawMode) last.mode = "mixed";
      } else {
        grouped.push({
          type:"maneuver",
          mode:raw.mode || (raw.type === "circularize" ? "circularize" : "manual"),
          sessionId:raw.sessionId == null ? null : raw.sessionId,
          simTime:raw.simTime,
          position:{...raw.position},
          deltaV:raw.deltaV,
          deltaVMps:raw.deltaVMps,
          absoluteDeltaVMps:Number.isFinite(raw.absoluteDeltaVMps) ? raw.absoluteDeltaVMps : Math.abs(raw.deltaVMps),
          beforeVelocity:{...raw.beforeVelocity},
          afterVelocity:{...raw.afterVelocity},
          adjustments
        });
      }
    }
    return grouped;
  }

  function validateArchive(data) {
    if (!data || data.format !== FORMAT || ![1, SCHEMA_VERSION].includes(data.schemaVersion)) throw new Error("不是本实验室生成的录像，或档案版本不兼容");
    if (!data.state || !data.state.position || !data.state.velocity || !Array.isArray(data.trajectory)) throw new Error("录像缺少卫星状态或轨迹数据");
    if (data.trajectory.length > MAX_TRAIL_POINTS) throw new Error("轨迹点数量超出安全上限");
    const numbers = [data.state.position.x,data.state.position.y,data.state.velocity.x,data.state.velocity.y,data.state.simTime];
    if (!numbers.every(Number.isFinite) || data.state.simTime < 0) throw new Error("录像中的物理量无效");
    if (Math.hypot(data.state.position.x,data.state.position.y)>1e9 || Math.hypot(data.state.velocity.x,data.state.velocity.y)>1000) throw new Error("录像中的位置或速度超出模型范围");
    for (const point of data.trajectory) if (!point || !Number.isFinite(point.x) || !Number.isFinite(point.y) || Math.hypot(point.x,point.y)>1e9) throw new Error("轨迹包含无效坐标");
    if (!Array.isArray(data.events)) data.events=[];
    for (const item of data.events) {
      if (!item || !Number.isFinite(item.simTime) || !Number.isFinite(item.deltaVMps) ||
          !item.position || !Number.isFinite(item.position.x) || !Number.isFinite(item.position.y) ||
          !item.afterVelocity || !Number.isFinite(item.afterVelocity.x) || !Number.isFinite(item.afterVelocity.y)) {
        throw new Error("录像中的变轨事件数据无效");
      }
    }
    data.events = normalizeManeuvers(data.events);
    data.schemaVersion = SCHEMA_VERSION;
    if (!data.meta || typeof data.meta!=="object") data.meta={};
  }

  waitForLab();
})();
